name: Build Android APK
on:
  push:
    branches: [ main ] # Triggers whenever you push to main

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      # Dynamically generate the android/ folder in the CI runner
      - name: Prebuild Android project
        run: bunx expo prebuild --platform android --no-install

      # Customize build.gradle with minification, shrinking, and abiFilters (armeabi-v7a, arm64-v8a)
      - name: Configure Android build options
        run: node scripts/configure-android-build.js

      - name: Build Android App (Release APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
