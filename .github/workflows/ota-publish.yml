name: Automated OTA Update Deployment

on:
  push:
    branches:
      - ota
  workflow_dispatch:

jobs:
  publish-ota:
    name: Build & Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Export Android Bundle
        run: bunx expo export -p android

      - name: Publish OTA Update to Cloudflare Server
        env:
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          RUNTIME_VERSION: "1.0.1"
        run: node scripts/publish-ota.js
